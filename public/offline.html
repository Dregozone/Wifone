<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f8487">
    <title>Offline - Wifone</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
            font-family: system-ui, sans-serif; text-align: center;
            background: #f2f6f7; color: #0e1b22;
        }
        @media (prefers-color-scheme: dark) { body { background: #0b151a; color: #f2f6f7; } }
        img { width: 72px; height: 72px; border-radius: 16px; }
        button {
            margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 8px;
            background: #0f8487; color: #fff; font: inherit; cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>Wifone needs an internet connection to make and receive calls.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
